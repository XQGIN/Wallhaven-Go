<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- 噪点纹理 -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
    </filter>

    <!-- 金属质感渐变 -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="25%" stop-color="#d0d0d0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="75%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <!-- 径向金属光泽 -->
    <radialGradient id="radialMetal" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0e0e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#404040" stop-opacity="0.3"/>
    </radialGradient>

    <!-- 内阴影 -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- 外发光 -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圆 - 深色基底 -->
  <circle cx="120" cy="120" r="110" fill="#0d0d0d"/>

  <!-- 噪点纹理层 -->
  <circle cx="120" cy="120" r="110" fill="transparent" filter="url(#noise)"/>

  <!-- 外圈装饰环 -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#metalGrad)" stroke-width="2"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#333" stroke-width="1"/>

  <!-- 主图形容器 - 六边形 -->
  <g transform="translate(120, 120)">
    <!-- 六边形背景 -->
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="#1a1a1a"
          stroke="url(#metalGrad)"
          stroke-width="2"/>

    <!-- 六边形内部金属光泽 -->
    <path d="M0,-65 L56.3,-32.5 L56.3,32.5 L0,65 L-56.3,32.5 L-56.3,-32.5 Z"
          fill="url(#radialMetal)"
          opacity="0.3"/>

    <!-- W 字母 - 几何切割风格 -->
    <g transform="translate(0, -5)" filter="url(#innerShadow)">
      <!-- W的左臂 -->
      <path d="M-45,-25 L-30,35 L-15,5 L0,35 L15,5 L30,35 L45,-25"
            fill="none"
            stroke="url(#metalGrad)"
            stroke-width="6"
            stroke-linecap="square"
            stroke-linejoin="miter"/>

      <!-- W的内部高光线条 -->
      <path d="M-45,-25 L-30,35 L-15,5 L0,35 L15,5 L30,35 L45,-25"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="square"
            stroke-linejoin="miter"
            opacity="0.6"/>
    </g>

    <!-- 下载箭头 - 三角形几何 -->
    <g transform="translate(0, 45)">
      <path d="M-12,0 L0,15 L12,0 L8,0 L8,-10 L-8,-10 L-8,0 Z"
            fill="url(#metalGrad)"
            filter="url(#innerShadow)"/>
      <path d="M-12,0 L0,15 L12,0"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.5"
            opacity="0.7"/>
    </g>
  </g>

  <!-- 四角装饰点 -->
  <g fill="#666">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="190" cy="50" r="3"/>
    <circle cx="50" cy="190" r="3"/>
    <circle cx="190" cy="190" r="3"/>
  </g>

  <!-- 底部 Go 标识 -->
  <g transform="translate(120, 205)">
    <text x="0" y="0"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="14"
          font-weight="bold"
          fill="#888"
          letter-spacing="4">GO</text>
  </g>

  <!-- 顶部高光反射 -->
  <ellipse cx="120" cy="60" rx="40" ry="15"
           fill="#ffffff"
           opacity="0.08"
           filter="url(#outerGlow)"/>
</svg>
